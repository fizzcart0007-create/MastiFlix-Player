<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>MastiFlix Player</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #000;
      color: #fff;
      font-family: Arial, sans-serif;
      min-height: 100vh;
    }

    .header {
      padding: 16px;
      text-align: center;
      font-size: 22px;
      font-weight: bold;
    }

    video {
      width: 100%;
      max-height: 75vh;
      background: #000;
      display: block;
    }

    .message {
      text-align: center;
      padding: 30px 20px;
      color: #aaa;
    }
  </style>
</head>

<body>

  <div class="header">
    🎬 MastiFlix
  </div>

  <video
    id="player"
    controls
    playsinline
    preload="metadata"
  ></video>

  <div class="message" id="message">
    Loading video...
  </div>

  <script>
    const player = document.getElementById("player");
    const message = document.getElementById("message");

    message.textContent = "MastiFlix Player Ready";
  </script>

</body>
</html>
